services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: rushboard
      POSTGRES_USER: rushboard
      POSTGRES_PASSWORD: rushboard-local
    volumes:
      - kitchen-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -h 127.0.0.1 -U rushboard -d rushboard]
      interval: 2s
      timeout: 3s
      retries: 15
  app:
    build: .
    environment:
      DATABASE_URL: postgresql://rushboard:rushboard-local@db:5432/rushboard
      FRONTEND_DIR: /app/frontend
    ports:
      - "127.0.0.1:${RUSHBOARD_PORT:-8080}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 3s
      timeout: 4s
      retries: 10

volumes:
  kitchen-data:
