name: Verify RushBoard

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  kitchen:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: rushboard_test
          POSTGRES_USER: rushboard
          POSTGRES_PASSWORD: rushboard-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U rushboard -d rushboard_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Test API against PostgreSQL
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql://rushboard:rushboard-test@localhost:5432/rushboard_test
        run: |
          python -m pip install -r requirements-test.txt
          python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build and start the Compose stack
        run: docker compose up --build --wait --wait-timeout 90
      - name: Verify the kitchen in Chromium
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Collect failure logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop the Compose stack
        if: always()
        run: docker compose down -v
